[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# No sqlalchemy.url here on purpose: env.py reads the DSN (or Cloud SQL Connector fields) and the
# target schema from the same QA_AUTHORING_-prefixed Settings the app uses — one source of truth.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
